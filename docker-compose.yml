version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 with pgvector (16 Declarative Hash Partitions & halfvec)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: psychs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psychs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-psychs_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psychs} -d ${POSTGRES_DB:-psychs_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - psychs-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (Two-Tier Vector & Semantic Deduplication Cache, tau >= 0.96)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: psychs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - psychs-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  # ----------------------------------------------------------------------------
  # 3. Forward-only schema migration using a database-owner credential.
  # ----------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - MIGRATION_DATABASE_URL=postgresql://${POSTGRES_USER:-psychs}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-psychs_db}
      - DATABASE_APP_USER=${DATABASE_APP_USER:-psychs_app}
      - DATABASE_APP_PASSWORD=${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD must be set}
      - DATABASE_WORKER_USER=${DATABASE_WORKER_USER:-psychs_worker}
      - DATABASE_WORKER_PASSWORD=${DATABASE_WORKER_PASSWORD:?DATABASE_WORKER_PASSWORD must be set}
    command: ["python", "-m", "app.database.migrate"]
    networks:
      - psychs-network

  # Explicit, idempotent first-tenant provisioning. This profile is never
  # started with the long-running application stack.
  bootstrap:
    profiles: ["bootstrap"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - MIGRATION_DATABASE_URL=postgresql://${POSTGRES_USER:-psychs}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-psychs_db}
      - PSYCHS_ENVIRONMENT=${PSYCHS_ENVIRONMENT:-development}
      - PSYCHS_BOOTSTRAP_TENANT_SLUG=${PSYCHS_BOOTSTRAP_TENANT_SLUG:-}
      - PSYCHS_BOOTSTRAP_TENANT_NAME=${PSYCHS_BOOTSTRAP_TENANT_NAME:-}
      - PSYCHS_BOOTSTRAP_EXTERNAL_SUBJECT=${PSYCHS_BOOTSTRAP_EXTERNAL_SUBJECT:-}
      - PSYCHS_BOOTSTRAP_EMAIL=${PSYCHS_BOOTSTRAP_EMAIL:-}
      - PSYCHS_BOOTSTRAP_ROLE=${PSYCHS_BOOTSTRAP_ROLE:-platform_admin}
      - PSYCHS_BOOTSTRAP_CONFIRM=${PSYCHS_BOOTSTRAP_CONFIRM:-}
    command: ["python", "-m", "app.database.bootstrap_tenant"]
    networks:
      - psychs-network

  # ----------------------------------------------------------------------------
  # 4. Psychs v2 API control plane
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psychs-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://${DATABASE_APP_USER:-psychs_app}:${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-psychs_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - PSYCHS_ENVIRONMENT=production
      - PSYCHS_V2_ENABLED=true
      - PSYCHS_JWT_SIGNING_KEY=${PSYCHS_JWT_SIGNING_KEY:?PSYCHS_JWT_SIGNING_KEY must be set}
      - PSYCHS_JWT_ISSUER=${PSYCHS_JWT_ISSUER:-psychs-platform}
      - PSYCHS_JWT_AUDIENCE=${PSYCHS_JWT_AUDIENCE:-psychs-api}
      - PSYCHS_CORS_ALLOWED_ORIGINS=${PSYCHS_CORS_ALLOWED_ORIGINS:?PSYCHS_CORS_ALLOWED_ORIGINS must be set}
      - PSYCHS_ALLOW_LEGACY_SERVER=${PSYCHS_ALLOW_LEGACY_SERVER:-false}
      - PSYCHS_OIDC_ISSUER=${PSYCHS_OIDC_ISSUER:?PSYCHS_OIDC_ISSUER must be set}
      - PSYCHS_OIDC_AUDIENCE=${PSYCHS_OIDC_AUDIENCE:-psychs-api}
      - PSYCHS_OIDC_JWKS_URL=${PSYCHS_OIDC_JWKS_URL:?PSYCHS_OIDC_JWKS_URL must be set}
      - PSYCHS_OIDC_ALGORITHMS=${PSYCHS_OIDC_ALGORITHMS:-RS256}
      - PSYCHS_OIDC_REQUIRE_JTI=${PSYCHS_OIDC_REQUIRE_JTI:-true}
      - PSYCHS_OIDC_MAX_TOKEN_LIFETIME_SECONDS=${PSYCHS_OIDC_MAX_TOKEN_LIFETIME_SECONDS:-900}
      - PSYCHS_OIDC_STEP_UP_MAX_AGE_SECONDS=${PSYCHS_OIDC_STEP_UP_MAX_AGE_SECONDS:-900}
      - PSYCHS_OIDC_STEP_UP_ACR_VALUES=${PSYCHS_OIDC_STEP_UP_ACR_VALUES:-}
      - PSYCHS_OIDC_STEP_UP_AMR_VALUES=${PSYCHS_OIDC_STEP_UP_AMR_VALUES:-mfa,otp,hwk}
      - PSYCHS_EVIDENCE_MAX_OBSERVATION_AGE_SECONDS=${PSYCHS_EVIDENCE_MAX_OBSERVATION_AGE_SECONDS:-86400}
      - PSYCHS_EVIDENCE_RETENTION_DAYS=${PSYCHS_EVIDENCE_RETENTION_DAYS:-90}
      - PSYCHS_MAX_REQUEST_BODY_BYTES=${PSYCHS_MAX_REQUEST_BODY_BYTES:-1048576}
      - PSYCHS_EVIDENCE_INGEST_RATE_LIMIT=${PSYCHS_EVIDENCE_INGEST_RATE_LIMIT:-120}
      - PSYCHS_EVIDENCE_INGEST_RATE_WINDOW_SECONDS=${PSYCHS_EVIDENCE_INGEST_RATE_WINDOW_SECONDS:-60}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-psychs-api}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_TRACE_SAMPLE_RATIO=${OTEL_TRACE_SAMPLE_RATIO:-0.1}
      - PSYCHS_EXECUTION_MODE=${PSYCHS_EXECUTION_MODE:-HYBRID_SANDBOX}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-6-astra}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - PERPLEXITY_MODEL=${PERPLEXITY_MODEL:-sonar-reasoning-pro}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.7-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-fable-5.1}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-reasoner}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - GLM_MODEL=${GLM_MODEL:-glm-4-plus}
      - GROK_API_KEY=${GROK_API_KEY:-}
      - GROK_MODEL=${GROK_MODEL:-grok-3}
      - PROXY_ROTATING_URL=${PROXY_ROTATING_URL:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - psychs-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # Dedicated trusted worker identity can claim across tenants, but has no HTTP surface.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_WORKER_URL=postgresql://${DATABASE_WORKER_USER:-psychs_worker}:${DATABASE_WORKER_PASSWORD:?DATABASE_WORKER_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-psychs_db}
      - PSYCHS_ENVIRONMENT=production
      - PSYCHS_JOB_LEASE_SECONDS=${PSYCHS_JOB_LEASE_SECONDS:-60}
      - PSYCHS_JOB_POLL_SECONDS=${PSYCHS_JOB_POLL_SECONDS:-2}
      - PSYCHS_JOB_RETRY_BASE_SECONDS=${PSYCHS_JOB_RETRY_BASE_SECONDS:-10}
      - PSYCHS_JOB_RETRY_CAP_SECONDS=${PSYCHS_JOB_RETRY_CAP_SECONDS:-900}
      - PSYCHS_RETENTION_CLEANUP_INTERVAL_SECONDS=${PSYCHS_RETENTION_CLEANUP_INTERVAL_SECONDS:-300}
      - PSYCHS_RETENTION_CLEANUP_BATCH_SIZE=${PSYCHS_RETENTION_CLEANUP_BATCH_SIZE:-1000}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_SERVICE_NAME=psychs-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
    command: ["python", "-m", "app.v2.worker"]
    networks:
      - psychs-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 5. Psychs Frontend Command Center (Nginx Multi-Stage Static + Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v2}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:?VITE_OIDC_AUTHORITY must be set}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:?VITE_OIDC_CLIENT_ID must be set}
        VITE_OIDC_AUDIENCE: ${VITE_OIDC_AUDIENCE:-psychs-api}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email offline_access projects:read projects:write}
        VITE_OIDC_STEP_UP_ACR_VALUES: ${VITE_OIDC_STEP_UP_ACR_VALUES:-}
    container_name: psychs-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - psychs-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

networks:
  psychs-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
