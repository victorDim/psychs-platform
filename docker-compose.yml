version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 with pgvector (16 Declarative Hash Partitions & halfvec)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: psychs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psychs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psychs_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-psychs_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psychs} -d ${POSTGRES_DB:-psychs_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - psychs-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (Two-Tier Vector & Semantic Deduplication Cache, tau >= 0.96)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: psychs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-psychs_redis_secret_2026}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-psychs_redis_secret_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - psychs-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  # ----------------------------------------------------------------------------
  # 3. Psychs Backend Engine & SSE Server (Native Async, 20/20 Test Suite)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psychs-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-psychs}:${POSTGRES_PASSWORD:-psychs_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-psychs_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-psychs_redis_secret_2026}@redis:6379/0
      - PSYCHS_EXECUTION_MODE=${PSYCHS_EXECUTION_MODE:-HYBRID_SANDBOX}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-6-astra}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - PERPLEXITY_MODEL=${PERPLEXITY_MODEL:-sonar-reasoning-pro}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.7-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-fable-5.1}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-reasoner}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - GLM_MODEL=${GLM_MODEL:-glm-4-plus}
      - GROK_API_KEY=${GROK_API_KEY:-}
      - GROK_MODEL=${GROK_MODEL:-grok-3}
      - PROXY_ROTATING_URL=${PROXY_ROTATING_URL:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - psychs-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # ----------------------------------------------------------------------------
  # 4. Psychs Frontend Command Center (Nginx Multi-Stage Static + Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: psychs-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - psychs-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

networks:
  psychs-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
