name: Psychs GEO Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/psychs-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/psychs-frontend

jobs:
  # ============================================================================
  # Stage 1: Static Analysis, TypeScript Verification & Backend Test Suite
  # ============================================================================
  lint-and-test:
    name: "Lint, Type Check & Test (20/20 Suite)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # --- Python Backend Verification ---
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute Psychs Backend 20/20 Test Suite
        run: |
          cd backend
          python run_tests.py

      # --- Frontend TypeScript Verification ---
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Type Check
        run: |
          cd frontend
          npm install
          npm run build

  # ============================================================================
  # Stage 2: Kubernetes Manifest Dry-Run Validation
  # ============================================================================
  validate-k8s:
    name: "Validate Kubernetes Manifests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Dry-run validate K8s Manifests
        run: |
          kubectl create --dry-run=client -f deploy/k8s/01-namespace-config.yaml -o yaml > /dev/null
          kubectl create --dry-run=client -f deploy/k8s/02-databases.yaml -o yaml > /dev/null
          kubectl create --dry-run=client -f deploy/k8s/03-backend-deployment.yaml -o yaml > /dev/null
          kubectl create --dry-run=client -f deploy/k8s/04-frontend-ingress.yaml -o yaml > /dev/null

  # ============================================================================
  # Stage 3: Container Build & Push to GHCR (Multi-Platform amd64/arm64)
  # ============================================================================
  build-and-push-containers:
    name: "Build & Push Containers to GHCR"
    needs: [lint-and-test, validate-k8s]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value=v2.0.0-prod,enable=true
            type=sha,format=short

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata (Tags & Labels) for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value=v2.0.0-prod,enable=true
            type=sha,format=short

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 4: Production Cluster GitOps Deployment Rollout
  # ============================================================================
  deploy-production:
    name: "Deploy to Production Cluster"
    needs: [build-and-push-containers]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Announce Deployment Completion
        run: |
          echo "========================================================================"
          echo "PSYCHS GEO PLATFORM v2.0.0-PROD SUCCESSFULLY DEPLOYED TO CLUSTER"
          echo "Frontend Ingress: https://geo.psychs.ai"
          echo "Backend Gateway:  https://geo.psychs.ai/api/v1/health"
          echo "========================================================================"
