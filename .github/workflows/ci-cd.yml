name: Psychs GEO Enterprise CI/CD Pipeline

concurrency:
  group: psychs-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/victordim/psychs-platform/psychs-backend
  IMAGE_FRONTEND: ghcr.io/victordim/psychs-platform/psychs-frontend

jobs:
  # ============================================================================
  # Stage 1: Static Analysis, TypeScript Verification & Backend Test Suite
  # ============================================================================
  lint-and-test:
    name: "Compile, Type Check & Test"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: psychs_owner
          POSTGRES_PASSWORD: ci-owner-password-not-for-production
          POSTGRES_DB: psychs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psychs_owner -d psychs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # --- Python Backend Verification ---
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --requirement backend/requirements.lock
          python -m pip check

      - name: Compile and Execute Backend Test Suite
        env:
          PYTHONPATH: backend
        run: |
          python -m compileall -q backend
          python backend/run_tests.py
          python -m pytest -q backend/tests/test_v2_runtime.py

      - name: Validate FastAPI Application and Offline Migration
        working-directory: backend
        env:
          PSYCHS_ENVIRONMENT: test
          PSYCHS_V2_ENABLED: "false"
        run: |
          python -c "from app.main import app; assert app.title == 'Psychs GEO Platform'"
          alembic upgrade head --sql > /tmp/psychs-schema.sql
          grep -q "ROW LEVEL SECURITY" /tmp/psychs-schema.sql

      - name: Verify PostgreSQL Migrations and Cross-Tenant RLS
        working-directory: backend
        env:
          MIGRATION_DATABASE_URL: postgresql://psychs_owner:ci-owner-password-not-for-production@127.0.0.1:5432/psychs_ci
          DATABASE_URL: postgresql://psychs_app:ci-application-password-32-chars@127.0.0.1:5432/psychs_ci
          DATABASE_APP_USER: psychs_app
          DATABASE_APP_PASSWORD: ci-application-password-32-chars
        run: |
          python -m app.database.migrate
          python -m pytest -q tests/integration/test_postgres_rls.py

      # --- Frontend TypeScript Verification ---
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check and Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Audit Frontend Production Dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # ============================================================================
  # Stage 2: Deployment & Kubernetes Manifests Verification
  # ============================================================================
  validate-k8s:
    name: "Validate Kubernetes & Deployment Manifests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Kubernetes Manifests Syntax & Integrity
        run: |
          python -c "
          import glob
          files = sorted(glob.glob('deploy/k8s/*.yaml'))
          assert len(files) >= 5, f'Expected at least 5 manifests, got {len(files)}'
          for f in files:
              content = open(f).read()
              assert 'apiVersion' in content and 'kind' in content, f'Invalid manifest {f}'
              assert 'kind: Secret' not in content, f'Commit external secrets, not Secret manifests: {f}'
              print(f'✓ Validated {f} ({len(content)} bytes)')
          print('All Kubernetes manifests validated successfully!')
          "

  # ============================================================================
  # Stage 3: Container Build & Push to GHCR (Fast Linux AMD64)
  # ============================================================================
  build-and-push-containers:
    name: "Build & Push Containers to GHCR"
    needs: [lint-and-test, validate-k8s]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,format=long

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata (Tags & Labels) for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,format=long

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=/api/v2
            VITE_OIDC_AUTHORITY=${{ vars.VITE_OIDC_AUTHORITY }}
            VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID }}
            VITE_OIDC_AUDIENCE=${{ vars.VITE_OIDC_AUDIENCE }}
            VITE_OIDC_SCOPE=${{ vars.VITE_OIDC_SCOPE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 4: Release candidate evidence. Production promotion requires a
  # separately reviewed GitOps change with immutable image digests.
  # ============================================================================
  release-candidate:
    name: "Publish Release Candidate Evidence"
    needs: [build-and-push-containers]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Record Release Candidate
        run: |
          echo "Images for commit $GITHUB_SHA were published to GHCR."
          echo "No production deployment was performed by this workflow."
          echo "Promote only after security review, migration validation, and rollback approval."
