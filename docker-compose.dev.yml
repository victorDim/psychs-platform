version: '3.8'

# ==============================================================================
# Psychs GEO Platform - Local Development & Hot-Reload Stack
# ==============================================================================
# Usage:
#   docker-compose -f docker-compose.dev.yml up --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 with pgvector (Development Mode)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: psychs-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psychs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psychs_dev_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-psychs_db}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/app/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psychs} -d ${POSTGRES_DB:-psychs_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - psychs-dev-network

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (Development Mode)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: psychs-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-psychs_redis_dev_2026}
    volumes:
      - redis_dev_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-psychs_redis_dev_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - psychs-dev-network

  # ----------------------------------------------------------------------------
  # 3. Psychs Backend Engine (Hot Code Reload Mount)
  # ----------------------------------------------------------------------------
  backend:
    image: python:3.12-slim
    container_name: psychs-backend-dev
    working_dir: /app
    volumes:
      - ./backend:/app
    command: python server.py 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-psychs}:${POSTGRES_PASSWORD:-psychs_dev_secret_2026}@postgres:5432/${POSTGRES_DB:-psychs_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-psychs_redis_dev_2026}@redis:6379/0
      - PSYCHS_EXECUTION_MODE=${PSYCHS_EXECUTION_MODE:-HYBRID_SANDBOX}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-6-astra}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - PERPLEXITY_MODEL=${PERPLEXITY_MODEL:-sonar-reasoning-pro}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.7-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-fable-5.1}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-reasoner}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - GLM_MODEL=${GLM_MODEL:-glm-4-plus}
      - GROK_API_KEY=${GROK_API_KEY:-}
      - GROK_MODEL=${GROK_MODEL:-grok-3}
      - PROXY_ROTATING_URL=${PROXY_ROTATING_URL:-}
    ports:
      - "8000:8000"
    networks:
      - psychs-dev-network

  # ----------------------------------------------------------------------------
  # 4. Psychs Frontend Vite Dev Server (HMR & Hot Reload)
  # ----------------------------------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: psychs-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - psychs-dev-network

networks:
  psychs-dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
