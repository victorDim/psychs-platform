# ==============================================================================
# Psychs GEO Platform v2.0.0-PROD - Backend Deployment, Service, PDB & HPA
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: psychs-backend-service
  namespace: psychs-prod
  labels:
    app.kubernetes.io/name: psychs-backend
    app.kubernetes.io/part-of: psychs-geo-system
spec:
  ports:
    - port: 8000
      name: http-api
      targetPort: 8000
  selector:
    app: psychs-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: psychs-backend
  namespace: psychs-prod
  labels:
    app.kubernetes.io/name: psychs-backend
    app.kubernetes.io/part-of: psychs-geo-system
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: psychs-backend
  template:
    metadata:
      labels:
        app: psychs-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/victordim/psychs-platform/psychs-backend:sha-REPLACE_WITH_COMMIT_SHA
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: psychs-config
            - secretRef:
                name: psychs-runtime-secrets
          env:
            - name: PSYCHS_ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: psychs-runtime-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: psychs-runtime-secrets
                  key: redis-url
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: psychs-observability-secrets
                  key: otlp-endpoint
                  optional: true
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: psychs-observability-secrets
                  key: otlp-metrics-endpoint
                  optional: true
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: psychs-observability-secrets
                  key: otlp-headers
                  optional: true
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /startupz
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: psychs-backend-pdb
  namespace: psychs-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: psychs-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: psychs-backend-hpa
  namespace: psychs-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: psychs-backend
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
