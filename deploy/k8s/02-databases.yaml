# ==============================================================================
# Psychs GEO Platform v2.0.0-PROD - PostgreSQL 16 pgvector & Redis 7
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: psychs-postgres
  namespace: psychs-prod
  labels:
    app.kubernetes.io/name: psychs-postgres
    app.kubernetes.io/part-of: psychs-geo-system
spec:
  ports:
    - port: 5432
      name: postgresql
      targetPort: 5432
  clusterIP: None
  selector:
    app: psychs-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: psychs-postgres
  namespace: psychs-prod
  labels:
    app.kubernetes.io/name: psychs-postgres
    app.kubernetes.io/part-of: psychs-geo-system
spec:
  serviceName: "psychs-postgres"
  replicas: 1
  selector:
    matchLabels:
      app: psychs-postgres
  template:
    metadata:
      labels:
        app: psychs-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: psychs-datastore-secrets
                  key: postgres-admin-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: psychs-datastore-secrets
                  key: postgres-admin-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: psychs-datastore-secrets
                  key: postgres-database
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: psychs-redis
  namespace: psychs-prod
  labels:
    app.kubernetes.io/name: psychs-redis
    app.kubernetes.io/part-of: psychs-geo-system
spec:
  ports:
    - port: 6379
      name: redis
      targetPort: 6379
  selector:
    app: psychs-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: psychs-redis
  namespace: psychs-prod
  labels:
    app.kubernetes.io/name: psychs-redis
    app.kubernetes.io/part-of: psychs-geo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: psychs-redis
  template:
    metadata:
      labels:
        app: psychs-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - "--appendonly"
            - "yes"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: psychs-datastore-secrets
                  key: redis-password
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            exec:
              command:
                - redis-cli
                - "-a"
                - "$(REDIS_PASSWORD)"
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - "-a"
                - "$(REDIS_PASSWORD)"
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: redis-storage
              mountPath: /data
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: psychs-redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: psychs-redis-pvc
  namespace: psychs-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
