# ==============================================================================
# Psychs GEO Platform v2.0.0-PROD - Kubernetes Namespace & Configuration
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: psychs-prod
  labels:
    app.kubernetes.io/name: psychs-platform
    app.kubernetes.io/part-of: psychs-geo-system
    app.kubernetes.io/managed-by: gitops-cab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: psychs-config
  namespace: psychs-prod
  labels:
    app.kubernetes.io/name: psychs-platform
    app.kubernetes.io/component: configuration
data:
  PSYCHS_EXECUTION_MODE: "HYBRID_SANDBOX"
  PSYCHS_V2_ENABLED: "true"
  PSYCHS_OIDC_ALGORITHMS: "RS256"
  LOG_LEVEL: "INFO"
  PORT: "8000"
  
  # Default Frontier AI Model Identifiers
  OPENAI_MODEL: "gpt-6-astra"
  PERPLEXITY_MODEL: "sonar-reasoning-pro"
  GEMINI_MODEL: "gemini-3.7-flash"
  ANTHROPIC_MODEL: "claude-fable-5.1"
  DEEPSEEK_MODEL: "deepseek-reasoner"
  GLM_MODEL: "glm-4-plus"
  GROK_MODEL: "grok-3"
  
# Secrets are intentionally not stored in Git. Provision them
# through External Secrets or the Secrets Store CSI driver before deployment.
