# ==============================================================================
# Psychs GEO Platform v2.0.0-PROD - Kubernetes Namespace & Configuration
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: psychs-prod
  labels:
    app.kubernetes.io/name: psychs-platform
    app.kubernetes.io/part-of: psychs-geo-system
    app.kubernetes.io/managed-by: gitops-cab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: psychs-config
  namespace: psychs-prod
  labels:
    app.kubernetes.io/name: psychs-platform
    app.kubernetes.io/component: configuration
data:
  PSYCHS_EXECUTION_MODE: "HYBRID_SANDBOX"
  PSYCHS_V2_ENABLED: "true"
  PSYCHS_OIDC_ALGORITHMS: "RS256"
  PSYCHS_OIDC_REQUIRE_JTI: "true"
  PSYCHS_OIDC_MAX_TOKEN_LIFETIME_SECONDS: "900"
  PSYCHS_OIDC_STEP_UP_MAX_AGE_SECONDS: "900"
  PSYCHS_OIDC_STEP_UP_AMR_VALUES: "mfa,otp,hwk"
  PSYCHS_EVIDENCE_MAX_OBSERVATION_AGE_SECONDS: "86400"
  PSYCHS_EVIDENCE_RETENTION_DAYS: "90"
  PSYCHS_MAX_REQUEST_BODY_BYTES: "1048576"
  PSYCHS_EVIDENCE_INGEST_RATE_LIMIT: "120"
  PSYCHS_EVIDENCE_INGEST_RATE_WINDOW_SECONDS: "60"
  PSYCHS_EVIDENCE_COLLECTION_ENABLED: "false"
  PSYCHS_EVIDENCE_COLLECTION_RATE_LIMIT: "10"
  PSYCHS_EVIDENCE_COLLECTION_RATE_WINDOW_SECONDS: "3600"
  PSYCHS_OPENAI_MODEL: "gpt-5"
  PSYCHS_OPENAI_TIMEOUT_SECONDS: "30"
  PSYCHS_OPENAI_MAX_OUTPUT_TOKENS: "2048"
  PSYCHS_SOURCE_SNAPSHOTS_ENABLED: "false"
  PSYCHS_SOURCE_SNAPSHOT_RATE_LIMIT: "30"
  PSYCHS_SOURCE_SNAPSHOT_RATE_WINDOW_SECONDS: "3600"
  PSYCHS_SOURCE_SNAPSHOT_TIMEOUT_SECONDS: "10"
  PSYCHS_SOURCE_SNAPSHOT_MAX_BYTES: "1048576"
  PSYCHS_SOURCE_SNAPSHOT_RETENTION_DAYS: "90"
  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: "psychs-api"
  OTEL_TRACE_SAMPLE_RATIO: "0.1"
  LOG_LEVEL: "INFO"
  PORT: "8000"
  
  # Default Frontier AI Model Identifiers
  OPENAI_MODEL: "gpt-6-astra"
  PERPLEXITY_MODEL: "sonar-reasoning-pro"
  GEMINI_MODEL: "gemini-3.7-flash"
  ANTHROPIC_MODEL: "claude-fable-5.1"
  DEEPSEEK_MODEL: "deepseek-reasoner"
  GLM_MODEL: "glm-4-plus"
  GROK_MODEL: "grok-3"
  
# Secrets are intentionally not stored in Git. Provision them
# through External Secrets or the Secrets Store CSI driver before deployment.
